<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL fixture</title>
<style>body{margin:0}canvas{display:block;width:100%;height:200px}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
c.width = c.clientWidth * (devicePixelRatio || 1);
c.height = 200 * (devicePixelRatio || 1);
const gl = c.getContext('webgl');
if (!gl) console.error('no webgl');
else { gl.clearColor(0.8, 0.1, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
</script>
</body>
</html>
