<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel art fixture</title>
<style>body{margin:0}canvas{display:block;width:320px;height:180px;image-rendering:pixelated}</style>
</head>
<body>
<canvas id="c" width="160" height="90"></canvas>
<script>document.getElementById('c').getContext('2d').fillRect(0, 0, 160, 90);</script>
</body>
</html>
