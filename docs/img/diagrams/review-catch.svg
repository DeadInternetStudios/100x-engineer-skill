points="388.0,271.5 420.4,265.0 452.9,268.3 485.3,258.5 517.8,252.0 550.2,255.3 582.7,245.5 615.1,239.0 647.6,242.3 680.0,232.5" fill="none" stroke="#7f8aa0" stroke-width="3" stroke-linejoin="miter"/><polyline points="388.0,271.5 420.4,255.3 452.9,281.3 485.3,248.8 517.8,232.5 550.2,242.3 582.7,219.5 615.1,203.3 647.6,216.3 680.0,193.5" fill="none" stroke="#eef1f6" stroke-width="3.5" stroke-linejoin="miter"/><path d="M28 348h28" stroke="#eef1f6" stroke-width="3.5"/><text x="66" y="354" font-size="20" fill="#eef1f6" >The stock</text><path d="M198 348h28" stroke="#7f8aa0" stroke-width="3"/><text x="236" y="354" font-size="20" fill="#a3acbb" >S&amp;P 500</text><rect x="28" y="388" width="664" height="82" fill="#2a2008"/><text x="48" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#ffb000" font-weight="700" letter-spacing=".06em">FINDING</text><text x="48" y="450" font-size="25" fill="#eef1f6" >The S&amp;P 500 line starts 5 months before the stock line</text><path d="M62 476V502" stroke="#6b7589" stroke-width="3"/><path d="M54 494L62 504L70 494" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="508" width="664" height="82" fill="#1c2330"/><text x="48" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">FIX</text><text x="48" y="570" font-size="25" fill="#eef1f6" >Both lines start on the first day both have prices</text><path d="M62 596V622" stroke="#6b7589" stroke-width="3"/><path d="M54 614L62 624L70 614" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="628" width="664" height="82" fill="#1c2330"/><text x="48" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">CHECK</text><text x="48" y="690" font-size="25" fill="#eef1f6" >A test fails if the start dates differ and it passes now</text>
