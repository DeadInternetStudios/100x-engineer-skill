<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 726" width="720" height="726" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">What the second model caught</title><desc id="d">Illustrated review of the stock comparison chart. Before: the S&amp;P 500 line starts 5 months before the stock line, so the two do not share a starting point. The second model flags it. After: both lines start at 0% on the first day both have prices. A test now fails if the start dates differ, and it passes.</desc>
