<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1338" width="720" height="1338" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">An overnight run</title><desc id="d">You type: /100x-overnight a farming game, for 8 hours. After the first full run, 100x works in rounds until the clock ends: fresh eyes, break it, hard test, then more. Each round ends with a fresh second model checking it, keeps the change if it helped and rolls it back if not. Finish refuses until the clock is over, then the report.</desc>
<rect width="720" height="1338" fill="#0b0e14"/><rect x=".75" y=".75" width="718.5" height="1336.5" fill="none" stroke="#262e3d" stroke-width="1.5"/>
<text x="28" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#b3d9ff" font-weight="700" letter-spacing=".06em">YOU TYPE</text><text x="28" y="84" font-size="25" fill="#b3d9ff" >/100x-overnight a farming game, for 8 hours</text><path d="M28 110H692" stroke="#262e3d" stroke-width="1.5"/><rect x="28" y="134" width="664" height="76" fill="#1c2330"/><text x="48" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">FIRST RUN</text><text x="48" y="195" font-size="26" fill="#eef1f6" >All eight steps once, tagged best</text><path d="M62 216V242" stroke="#6b7589" stroke-width="3"/><path d="M54 234L62 244L70 234" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="248" width="664" height="76" fill="#1c2330"/><text x="48" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">ROUND 1 · FRESH EYES</text><text x="48" y="309" font-size="26" fill="#eef1f6" >Every screen, like a stranger</text><path d="M62 330V356" stroke="#6b7589" stroke-width="3"/><path d="M54 348L62 358L70 348" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="362" width="664" height="76" fill="#2a2008"/><text x="48" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#ffb000" font-weight="700" letter-spacing=".06em">JUDGE</text><text x="48" y="423" font-size="26" fill="#eef1f6" >A fresh second model checks the round</text><path d="M62 444V470" stroke="#6b7589" stroke-width="3"/><path d="M54 462L62 472L70 462" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="476" width="664" height="76" fill="#1c2330"/><text x="48" y="505" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">ROUND 2 · BREAK IT</text><text x="48" y="537" font-size="26" fill="#eef1f6" >Empty, huge, offline, rapid taps</text><path d="M62 558V584" stroke="#6b7589" stroke-width="3"/><path d="M54 576L62 586L70 576" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="590" width="664" height="76" fill="#2a2008"/><text x="48" y="619" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#ffb000" font-weight="700" letter-spacing=".06em">JUDGE</text><text x="48" y="651" font-size="26" fill="#eef1f6" >A fresh second model checks the round</text><path d="M62 672V698" stroke="#6b7589" stroke-width="3"/><path d="M54 690L62 700L70 690" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="704" width="664" height="76" fill="#1c2330"/><text x="48" y="733" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">ROUND 3 · HARD TEST</text><text x="48" y="765" font-size="26" fill="#eef1f6" >Five more tests on the key thing</text><path d="M62 786V812" stroke="#6b7589" stroke-width="3"/><path d="M54 804L62 814L70 804" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="818" width="664" height="76" fill="#2a2008"/><text x="48" y="847" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#ffb000" font-weight="700" letter-spacing=".06em">JUDGE</text><text x="48" y="879" font-size="26" fill="#eef1f6" >A fresh second model checks the round</text><path d="M62 900V926" stroke="#6b7589" stroke-width="3"/><path d="M54 918L62 928L70 918" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="29" y="933" width="662" height="74" fill="none" stroke="#262e3d" stroke-width="2" stroke-dasharray="6 6"/><text x="48" y="961" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#6b7589" font-weight="700" letter-spacing=".06em">MORE ROUNDS</text><text x="48" y="993" font-size="26" fill="#a3acbb" >More lenses, then a harder lap</text><path d="M62 1014V1040" stroke="#6b7589" stroke-width="3"/><path d="M54 1032L62 1042L70 1032" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="1046" width="664" height="76" fill="#1c2330"/><text x="48" y="1075" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">END</text><text x="48" y="1107" font-size="26" fill="#eef1f6" >Finish refuses until the clock is over</text><path d="M62 1128V1154" stroke="#6b7589" stroke-width="3"/><path d="M54 1146L62 1156L70 1146" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="1160" width="664" height="76" fill="#1c2330"/><text x="48" y="1189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">REPORT</text><text x="48" y="1221" font-size="26" fill="#eef1f6" >One page: every run, best first</text><text x="28" y="1276" font-size="23" fill="#eef1f6" >Each round: measure, change, measure again</text><text x="28" y="1310" font-size="23" fill="#eef1f6" >Keep what got better, roll back the rest</text>
</svg>
