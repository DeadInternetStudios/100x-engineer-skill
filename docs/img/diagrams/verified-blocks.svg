<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 882" width="720" height="882" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Small verified blocks</title><desc id="d">Each small block states six properties: state, steps, rules, results, what always holds and what must eventually happen. Each block is checked on its own. The seams between blocks are checked. The real blocks then run together in one system model. The ledger marks a proof stale when the code under it changes.</desc>
<rect width="720" height="882" fill="#0b0e14"/><rect x=".75" y=".75" width="718.5" height="880.5" fill="none" stroke="#262e3d" stroke-width="1.5"/>
<text x="28" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">SIX PROPERTIES PER BLOCK</text><text x="28" y="84" font-size="25" fill="#eef1f6" >state, steps, rules, results, always, eventually</text><path d="M28 110H692" stroke="#262e3d" stroke-width="1.5"/><rect x="28" y="134" width="664" height="76" fill="#1c2330"/><text x="48" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">BLOCK · SPLIT A BILL</text><text x="48" y="195" font-size="26" fill="#eef1f6" >Every cent lands in exactly one share</text><path d="M62 216V242" stroke="#6b7589" stroke-width="3"/><path d="M54 234L62 244L70 234" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="248" width="664" height="76" fill="#1c2330"/><text x="48" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">BLOCK · ORDER</text><text x="48" y="309" font-size="26" fill="#eef1f6" >Only a paid order ships</text><path d="M62 330V356" stroke="#6b7589" stroke-width="3"/><path d="M54 348L62 358L70 348" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="362" width="664" height="76" fill="#1c2330"/><text x="48" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">BLOCK · REFUND</text><text x="48" y="423" font-size="26" fill="#eef1f6" >Never more than was paid</text><path d="M62 444V470" stroke="#6b7589" stroke-width="3"/><path d="M54 462L62 472L70 462" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="476" width="664" height="76" fill="#1c2330"/><text x="48" y="505" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">SEAMS</text><text x="48" y="537" font-size="26" fill="#eef1f6" >What one block gives, the next accepts</text><path d="M62 558V584" stroke="#6b7589" stroke-width="3"/><path d="M54 576L62 586L70 576" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="590" width="664" height="76" fill="#1c2330"/><text x="48" y="619" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">SYSTEM MODEL</text><text x="48" y="651" font-size="26" fill="#eef1f6" >The real blocks run together</text><path d="M62 672V698" stroke="#6b7589" stroke-width="3"/><path d="M54 690L62 700L70 690" fill="none" stroke="#6b7589" stroke-width="3" stroke-linejoin="miter"/><rect x="28" y="704" width="664" height="76" fill="#1c2330"/><text x="48" y="733" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#a3acbb" font-weight="700" letter-spacing=".06em">LEDGER</text><text x="48" y="765" font-size="26" fill="#eef1f6" >Change the code, the proof goes stale</text><text x="28" y="820" font-size="23" fill="#eef1f6" >Each block is checked on its own</text><text x="28" y="854" font-size="23" fill="#eef1f6" >Then all of them are checked together</text>
</svg>
